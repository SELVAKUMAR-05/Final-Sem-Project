version: '3.8'

services:
  # 1. MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: securedms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_2026}
      MYSQL_DATABASE: ${DB_NAME:-securedms_db}
      MYSQL_USER: ${DB_USER:-securedms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-securedms_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    networks:
      - securedms-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. Application Backend Service (Spring Boot / Node Engine)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securedms-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-ncrb-secure-legal-dms-mha-secret-key-2026}
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:-ncrb-aes256-evidence-enc-key-32b!}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-securedms_db}
      DB_USER: ${DB_USER:-securedms_user}
      DB_PASSWORD: ${DB_PASSWORD:-securedms_pass}
    volumes:
      - ./storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - securedms-net

networks:
  securedms-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
