# Spring Boot Application Properties
spring.application.name=secure-dms-backend
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:securedms_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:securedms_user}
spring.datasource.password=${DB_PASSWORD:securedms_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Storage Directory
storage.location=storage/cases

# Security Keys (Always supply via environment in production)
jwt.secret=${JWT_SECRET:ncrb-secure-legal-dms-mha-secret-key-2026}
jwt.expiration.ms=28800000
security.encryption.key=${DOCUMENT_ENCRYPTION_KEY:ncrb-aes256-evidence-enc-key-32b!}
